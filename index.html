<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12333D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>קוס 14–18.9</title>
<style>
:root{
  --ink:#12333D; --ink-soft:#3D5B64; --chalk:#E9EDE9; --paper:#FBFAF6;
  --line:#CBD4CE; --lemon:#E8B317; --tile:#A6472E; --olive:#6E7B4C;
  --sea:#2E6F8E; --mustard:#C08A22; --coffee:#7A5540; --plum:#6D4C6E;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--chalk);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:78px}
.wrap{max-width:660px;margin:0 auto}
h1,h2,h3{margin:0;letter-spacing:-.015em}

/* header + tabs */
header{background:var(--ink);color:var(--paper);padding:18px 18px 0}
h1{font-size:27px;font-weight:800}
.dates{font-size:13.5px;color:#B9CBD1;margin-top:4px}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:none;border-bottom:4px solid transparent;
  color:#9FB6BD;font:inherit;font-size:15px;font-weight:700;padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--lemon)}
section[role="tabpanel"]{padding:16px 18px 8px}
section[hidden]{display:none}

/* generic blocks */
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.block h2{font-size:17px;font-weight:800;margin-bottom:8px}
.block h3{font-size:14.5px;font-weight:800;color:var(--ink-soft);margin:12px 0 5px}
.block p{margin:0 0 8px;font-size:14.5px}
.block p:last-child{margin-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-weight:700;text-align:left;direction:ltr}
.note{border-inline-start:4px solid var(--lemon);background:#FDF6E0;border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0 0}
.note b{display:block;margin-bottom:2px}
.warn{border-inline-start:4px solid var(--tile);background:#F8ECE7}
.warn b{color:var(--tile)}

/* now tab */
.hero{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hero .lab{font-size:13.5px;color:#B9CBD1;margin-top:6px}
.hero .line{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);font-size:14.5px}
.hero .line b{color:var(--lemon)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick button{flex:1 1 46%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:var(--paper);font:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:8px;cursor:pointer}

/* itinerary */
.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.day.today{border-color:var(--lemon);border-width:2px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 14px;background:#F2F4F0;border-bottom:1px solid var(--line);cursor:pointer}
.dhead .t{font-size:16.5px;font-weight:800}
.dhead .d{font-size:13px;color:var(--ink-soft);font-weight:700}
.dbody{padding:6px 14px 14px}
.item{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.time{flex:0 0 52px;font-size:13px;font-weight:800;color:var(--sea);padding-top:2px;direction:ltr;text-align:right}
.itxt{flex:1;min-width:0}
.itxt .h{font-size:15.5px;font-weight:700}
.itxt .p{font-size:14px;color:var(--ink-soft);margin-top:2px}
.jump{display:inline-block;margin:6px 5px 0 0;background:var(--chalk);border:1px solid var(--line);
  border-radius:14px;padding:4px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;direction:ltr}

/* food */
.moods{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.mood{flex:0 0 auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;
  padding:9px 15px;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer}
.mood[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.searchrow{display:flex;gap:8px;align-items:center}
input[type="search"]{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 13px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:14.5px;padding:11px 14px;cursor:pointer;border-radius:var(--r);
  border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.frow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;align-items:center}
.flabel{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.chip{font:inherit;font-size:13.5px;font-weight:600;padding:6px 11px;cursor:pointer;border-radius:20px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
select{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px;font-size:13px;color:var(--ink-soft)}
.linkish{background:none;border:none;font:inherit;font-size:13px;color:var(--ink);text-decoration:underline;cursor:pointer;padding:4px}
#pick{display:none;margin-bottom:10px}
#pick.on{display:block}
.pickbox{background:var(--lemon);border-radius:var(--r);padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pickbox .t{font-size:12.5px;font-weight:700;color:#6B5200}
.pickbox .n{font-size:19px;font-weight:800;direction:ltr}
.pickbox .d{font-size:13px;color:#5E4A05;margin-top:2px}
.pickbox button{background:#12333D;color:#fff;border:none;border-radius:8px;padding:9px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-inline-start:5px solid var(--c);
  border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.card.hit{outline:3px solid var(--lemon);outline-offset:2px}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:18.5px;font-weight:800;direction:ltr;text-align:right}
.kind{font-size:12.5px;font-weight:700;color:var(--c);margin-top:1px}
.fav{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;padding:2px;color:var(--line)}
.fav[aria-pressed="true"]{color:var(--tile)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.stat{font-size:12.5px;font-weight:600;background:var(--chalk);border-radius:6px;padding:4px 8px}
.stat.rate{background:#F4E6BC;color:#6B5200}
.try{margin:10px 0 0;font-size:14.5px}
.try b{color:var(--ink-soft)}
.addr{margin:6px 0 0;font-size:13px;color:var(--ink-soft)}
.acts{display:flex;gap:8px;margin-top:11px}
.acts a,.acts button{flex:1;text-align:center;font:inherit;font-size:13.5px;font-weight:700;padding:9px 6px;
  border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.acts a{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.more{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:14.5px}
.more.open{display:block}
.more p{margin:0 0 7px}
.lab{font-weight:700;color:var(--ink-soft)}
.empty{text-align:center;padding:36px 20px;color:var(--ink-soft)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

/* checklist */
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.box{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:14px;color:transparent;margin-top:1px}
.check[aria-checked="true"] .box{background:var(--olive);border-color:var(--olive);color:#fff}
.check[aria-checked="true"] .ctxt{text-decoration:line-through;color:var(--ink-soft)}
.ctxt{font-size:14.5px}
.ctxt small{display:block;color:var(--ink-soft);font-size:12.5px;text-decoration:none}

/* phrases */
.ph{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.ph:last-child{border-bottom:none}
.ph .gr{direction:ltr;text-align:left;font-weight:700}
.ph .gr small{display:block;font-weight:400;color:var(--ink-soft)}

.dock{position:fixed;inset-block-end:0;inset-inline:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--chalk) 72%,rgba(233,237,233,0))}
.dock .inner{max-width:660px;margin:0 auto;display:flex;gap:8px}
.dock button{flex:1}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
</style>
</head>

<header>
  <h1>קוס — חופשה זוגית</h1>
  <div class="dates">14–18 בספטמבר · 4 לילות · Blue Lagoon City Hotel</div>
  <nav role="tablist">

    <button class="tab" role="tab" aria-selected="false" data-p="food">אוכל</button>
    <button class="tab" role="tab" aria-selected="false" data-p="info">מידע</button>
    <button class="tab" role="tab" aria-selected="false" data-p="prep">לפני הטיסה</button>
  </nav>
</header>

  </div>
  <div class="meta"><span id="count"></span><button class="linkish" id="reset">ניקוי סינון</button></div>
  <div id="pick"></div>
  <div id="list"></div>
</section>

<section role="tabpanel" id="p-info" hidden></section>

<section role="tabpanel" id="p-prep" hidden></section>

</div>

<div class="dock"><div class="inner">
  <button class="btn" id="pickBtn">תבחר לי מקום</button>
  <button class="btn ghost" id="topBtn">לראש העמוד</button>
</div></div>

/* שמירה: קודם מנסים את אחסון המארח, ואם אין — localStorage של הדפדפן */
async function readKey(k){
  try{const r=await window.storage.get("kos:"+k); if(r&&r.value) return r.value;}catch(e){}
  try{return localStorage.getItem("kos:"+k);}catch(e){}
  return null;
}
async function load(){
  const a=await readKey("favs"); if(a){try{JSON.parse(a).forEach(x=>state.favs.add(x));}catch(e){}}
  const b=await readKey("done"); if(b){try{JSON.parse(b).forEach(x=>state.done.add(x));}catch(e){}}
}
async function save(k,set){
  const v=JSON.stringify([...set]);
  try{ localStorage.setItem("kos:"+k,v); }catch(e){}
  try{ await window.storage.set("kos:"+k,v); }catch(e){}
}

/* ================= HELPERS ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byName=n=>PLACES.find(p=>p.n===n);
function priceText(p){return p.lo===p.hi?"€"+p.lo:"€"+p.lo+"–€"+p.hi;}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayIndexToday(){return DAYS.findIndex(d=>d.date===todayISO());}
function daysTo(dateStr){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(dateStr+"T00:00:00");
  return Math.round((d-t)/86400000);
}
function tipHTML(tips){
  return (tips||[]).map(x=>'<div class="note'+(x.k==="warn"?" warn":"")+'"><b>'+esc(x.b)+'</b>'+esc(x.t)+'</div>').join("");
}
function placeChips(names){
  return (names||[]).map(n=>'<button class="jump" data-place="'+esc(n)+'">'+esc(n)+'</button>').join("");
}

/* ================= TABS ================= */
function setTab(id){
  state.tab=id;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.p===id?"true":"false"));
  ["now","plan","food","info","prep"].forEach(p=>{
    const el=document.getElementById("p-"+p);
    if(p===id) el.removeAttribute("hidden"); else el.setAttribute("hidden","");
  });
  document.querySelector(".dock").style.display = id==="food" ? "" : "none";
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.p));

  const h=new Date().getHours();
  if(h>=6&&h<11)  return ["בוקר — קפה או בראנץ׳","The Cup","Alchimion Coffee and Brunch"];
  if(h>=11&&h<16) return ["צהריים — משהו מהיר","Avlo-Gyros","Socrates Taverna"];
  if(h>=16&&h<19) return ["אחר הצהריים — קפה או שקיעה","Koako","Cafe Neratzia"];
  if(h>=19&&h<23) return ["ערב — בדיוק כשהמקומיים יוצאים","Hirodion Taverna","Astakos Seafood & Grill"];
  return ["מאוחר — רוב המטבחים סגורים","Kaseta All-Day Cafe Bar","Special Ice Cream & Gelato di Nonna"];

/* ================= FOOD ================= */
function buildChips(){
  const m=document.getElementById("moods");
  MOODS.forEach(mo=>{
    const b=document.createElement("button");
    b.className="mood"; b.textContent=mo.label; b.setAttribute("aria-pressed","false"); b.dataset.id=mo.id;
    b.onclick=()=>{state.mood=state.mood===mo.id?null:mo.id; syncMoods(); renderFood();};
    m.appendChild(b);
  });
  const cw=document.getElementById("cats");
  Object.entries(CAT).forEach(([k,v])=>{
    const b=document.createElement("button"); b.className="chip cat"; b.textContent=v.label;
    b.style.setProperty("--c",v.color); b.setAttribute("aria-pressed","false");
    b.onclick=()=>toggle(state.cats,k,b); cw.appendChild(b);
  });
  const aw=document.getElementById("areas");
  Object.entries(AREA).forEach(([k,v])=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=v; b.setAttribute("aria-pressed","false");
    b.onclick=()=>toggle(state.areas,k,b); aw.appendChild(b);
  });
  const pw=document.getElementById("prices");
  Object.entries(PRICE).forEach(([k,v])=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=v; b.setAttribute("aria-pressed","false");
    b.onclick=()=>toggle(state.prices,Number(k),b); pw.appendChild(b);
  });
}
function toggle(set,key,btn){
  set.has(key)?set.delete(key):set.add(key);
  btn.setAttribute("aria-pressed",set.has(key)?"true":"false"); renderFood();
}
function syncMoods(){document.querySelectorAll(".mood").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===state.mood?"true":"false"));}

function filtered(){
  const mood=MOODS.find(m=>m.id===state.mood), q=state.q.trim().toLowerCase();
  let out=PLACES.filter(p=>{
    if(mood&&!mood.test(p))return false;
    if(state.cats.size&&!state.cats.has(p.c))return false;
    if(state.areas.size&&!state.areas.has(p.a))return false;
    if(state.prices.size&&!state.prices.has(p.p))return false;
    if(state.favOnly&&!state.favs.has(p.n))return false;
    if(q){const hay=(p.n+" "+p.addr+" "+p.try+" "+p.desc+" "+(p.forWho||"")+" "+CAT[p.c].label).toLowerCase(); if(!hay.includes(q))return false;}
    return true;
  });
  const s=state.sort;
  out.sort((a,b)=>{
    if(s==="rating")return (b.r||0)-(a.r||0)||(b.rv||0)-(a.rv||0);
    if(s==="reviews")return (b.rv||0)-(a.rv||0);
    if(s==="cheap")return a.lo-b.lo||a.hi-b.hi;
    return a.n.localeCompare(b.n);
  });
  return out;
}
function renderFood(){
  const data=filtered();
  document.getElementById("count").textContent=data.length+" מקומות"+(state.favs.size?" · "+state.favs.size+" מועדפים":"");
  const list=document.getElementById("list"); list.innerHTML="";
  if(!data.length){list.innerHTML='<div class="empty"><b>אין התאמה לסינון הזה</b>נסה להסיר קטגוריה או לאפס את הסינון.</div>';return;}
  data.forEach(p=>{
    const cat=CAT[p.c], card=document.createElement("article");
    card.className="card"; card.style.setProperty("--c",cat.color); card.dataset.n=p.n;
    const head=document.createElement("div"); head.className="chead";
    const titles=document.createElement("div");
    titles.innerHTML='<div class="name">'+esc(p.n)+'</div><div class="kind">'+cat.label+' · '+AREA[p.a]+'</div>';
    const fav=document.createElement("button");
    fav.className="fav"; fav.setAttribute("aria-pressed",state.favs.has(p.n)?"true":"false");
    fav.setAttribute("aria-label","מועדפים"); fav.textContent=state.favs.has(p.n)?"♥":"♡";
    fav.onclick=()=>{state.favs.has(p.n)?state.favs.delete(p.n):state.favs.add(p.n); save("favs",state.favs); renderFood();};
    head.append(titles,fav);
    const stats=document.createElement("div"); stats.className="stats";
    if(p.r) stats.innerHTML+='<span class="stat rate">★ '+p.r.toFixed(1)+' · '+p.rv.toLocaleString("he-IL")+' ביקורות</span>';
    stats.innerHTML+='<span class="stat">'+priceText(p)+' לאדם</span>';
    const tr=document.createElement("p"); tr.className="try"; tr.innerHTML='<b>לנסות:</b> '+esc(p.try);
    const ad=document.createElement("p"); ad.className="addr"; ad.textContent=p.addr;
    const acts=document.createElement("div"); acts.className="acts";
    const map=document.createElement("a");
    map.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.n+", Kos, Greece");
    map.target="_blank"; map.rel="noopener"; map.textContent="מפה";
    const more=document.createElement("button"); more.textContent="עוד";
    const box=document.createElement("div"); box.className="more";
    box.innerHTML='<p>'+esc(p.desc)+'</p>'+(p.forWho?'<p><span class="lab">מתאים ל:</span> '+esc(p.forWho)+'</p>':'');
    more.onclick=()=>{more.textContent=box.classList.toggle("open")?"פחות":"עוד";};
    acts.append(map,more);
    card.append(head,stats,tr,ad,acts,box);
    list.appendChild(card);
  });
}
function pickOne(){
  const data=filtered(), box=document.getElementById("pick");
  if(!data.length){box.className="";return;}
  const p=data[Math.floor(Math.random()*data.length)];
  box.className="on";
  box.innerHTML='<div class="pickbox"><div><div class="t">ההצעה שלי עכשיו</div><div class="n">'+esc(p.n)+'</div>'+
    '<div class="d">'+CAT[p.c].label+' · '+priceText(p)+' · '+esc(p.try)+'</div></div><button id="again">עוד אחד</button></div>';
  document.getElementById("again").onclick=pickOne;
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("hit",c.dataset.n===p.n));
  const target=[...document.querySelectorAll(".card")].find(c=>c.dataset.n===p.n);
  if(target) target.scrollIntoView({behavior:"smooth",block:"center"});
}
function gotoPlace(name){
  setTab("food");
  state.mood=null; state.cats.clear(); state.areas.clear(); state.prices.clear(); state.favOnly=false;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  syncMoods();
  state.q=name; document.getElementById("q").value=name;
  renderFood();
}

  '<p><b>שולחן ב־Barbouni ליום חמישי.</b> זו הארוחה החגיגית של החופשה, והמקום מלא. הודעה או שיחה מראש שווה את הטרחה.</p>'+
  '<p><b>שולחן ב־Oromedon בזיה ליום רביעי, ולבקש במפורש שולחן על המרפסת.</b> ההבדל בין שולחן פנימי לשולחן על הקצה הוא כל הסיבה לעלות להר.</p>'+
  '<p><b>ההפלגה ל־3 האיים — דווקא לא מראש.</b> להזמין בדוכן על הרציף ביום הראשון, אחרי שרואים את תחזית הרוח. אותו מחיר, ואפשר להחליף יום אם צריך.</p></div>';
  document.querySelectorAll(".check").forEach(el=>{
    const t=()=>{
      const i=el.dataset.i, on=el.getAttribute("aria-checked")==="true";
      el.setAttribute("aria-checked",on?"false":"true");
      on?state.done.delete(i):state.done.add(i);
      save("done",state.done);
      if(state.tab==="now") renderNow();
    };
    el.onclick=t;
    el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();t();}};
  });
}

/* ================= WIRING ================= */
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-place]");
  if(p){gotoPlace(p.dataset.place);return;}
  const g=e.target.closest("[data-go]");
  if(g){setTab(g.dataset.go);return;}
  const dh=e.target.closest(".dhead");
  if(dh){const b=dh.nextElementSibling; b.style.display = b.style.display==="none"?"":"none";}
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;renderFood();});
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;renderFood();});
document.getElementById("favOnly").addEventListener("click",e=>{
  state.favOnly=!state.favOnly; e.target.setAttribute("aria-pressed",state.favOnly?"true":"false"); renderFood();
});
document.getElementById("toggleFilters").addEventListener("click",e=>{
  const f=document.getElementById("filters"), show=f.hasAttribute("hidden");
  show?f.removeAttribute("hidden"):f.setAttribute("hidden","");
  e.target.setAttribute("aria-expanded",show?"true":"false");
});
document.getElementById("reset").addEventListener("click",()=>{
  state.mood=null;state.cats.clear();state.areas.clear();state.prices.clear();state.q="";state.favOnly=false;
  document.getElementById("q").value="";
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  document.getElementById("favOnly").setAttribute("aria-pressed","false");
  syncMoods(); document.getElementById("pick").className=""; renderFood();
});
document.getElementById("pickBtn").addEventListener("click",pickOne);
document.getElementById("topBtn").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

buildChips();
function renderAll(){renderNow();renderPlan();renderFood();renderInfo();renderPrep();}
renderAll();
setTab("now");
load().then(renderAll).then(()=>setTab(state.tab));
</script>
</body>
</html>
